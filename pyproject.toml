[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-microstructure-execution"
version = "0.1.0"
description = "Execution-aware BTCUSDT market-microstructure research with causal execution, holdout validation, latency stress, and transaction-cost analysis."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Amir Mahmoudinia" }
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "src",
    "src.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
